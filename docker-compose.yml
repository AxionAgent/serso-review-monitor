services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-serso}
      MYSQL_USER: ${MYSQL_USER:-serso}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-serso}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-super123}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      VITE_APP_ID: ${VITE_APP_ID:-}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
    command: ["sh", "-c", "pnpm exec drizzle-kit migrate && node dist/index.js"]

  # DB v2 — isolated untuk instance reviewv2
  db-v2:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE_V2:-serso_v2}
      MYSQL_USER: ${MYSQL_USER_V2:-serso_v2}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD_V2:?Set MYSQL_PASSWORD_V2}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_v2_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  # reviewv2 = full app (admin dashboard sama persis kayak review) dgn DB terpisah
  app-full-v2:
    build: .
    restart: unless-stopped
    depends_on:
      db-v2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "${PORT_FULL_V2:-9313}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER_V2}:${MYSQL_PASSWORD_V2}@db-v2:3306/${MYSQL_DATABASE_V2:-serso_v2}
      JWT_SECRET: ${JWT_SECRET_V2:?Set JWT_SECRET_V2}
      ADMIN_USERNAME: ${ADMIN_USERNAME_V2:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD_V2:-admin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD_V2:-super123}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      VITE_APP_ID: ${VITE_APP_ID:-}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
    command: ["sh", "-c", "pnpm exec drizzle-kit migrate && node dist/index.js"]

volumes:
  mysql_data:
  mysql_v2_data:
