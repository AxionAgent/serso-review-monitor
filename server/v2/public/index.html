<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Service Solution — Customer Feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f7ff; color: #0f2f5f; min-height: 100vh; }
    .page { max-width: 520px; margin: 0 auto; padding: 24px 16px 40px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 0 4px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { width: 38px; height: 38px; border-radius: 14px; background: #0f2f5f; color: #79a8ff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
    .brand-name { font-size: 14px; font-weight: 700; color: #0f2f5f; line-height: 1.1; }
    .brand-sub { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #2f6fed; }
    .admin-link { font-size: 11px; font-weight: 700; color: #2f6fed; text-decoration: none; background: #fff; border: 1px solid #dbe7ff; padding: 6px 12px; border-radius: 999px; }
    .card { background: #ffffff; border: 1px solid #eef2f9; border-radius: 28px; box-shadow: 0 24px 60px -32px rgba(47,111,237,.28); overflow: hidden; }
    .card-navy { background: #0f2f5f; padding: 32px 28px; color: white; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #a5e8c9; margin-bottom: 14px; }
    .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: #a5e8c9; }
    .card-navy h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; color: #fff; margin-bottom: 10px; }
    .card-navy p { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,.75); }
    .card-body { padding: 28px; }
    .qr-box { background: #f7faff; border: 1px solid #e3ebfb; border-radius: 22px; padding: 24px; display: flex; justify-content: center; }
    .qr-box img { width: 100%; max-width: 260px; height: auto; }
    .qr-url { text-align: center; margin-top: 14px; font-size: 13px; font-weight: 600; color: #2f6fed; word-break: break-all; }
    .qr-hint { text-align: center; margin-top: 6px; font-size: 12px; color: #94a3b8; }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    .btn { flex: 1; padding: 14px 16px; border-radius: 16px; font-size: 14px; font-weight: 700; text-align: center; cursor: pointer; text-decoration: none; display: inline-block; font-family: inherit; transition: .15s; }
    .btn-primary { background: #2f6fed; color: #fff; border: none; box-shadow: 0 10px 24px -10px rgba(47,111,237,.5); }
    .btn-primary:hover { background: #2459c7; }
    .btn-secondary { background: #fff; color: #0f2f5f; border: 1px solid #e3ebfb; }
    .btn-secondary:hover { border-color: #2f6fed; color: #2f6fed; }
    .note { text-align: center; margin-top: 22px; font-size: 11px; color: #94a3b8; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <div class="logo">SS</div>
        <div>
          <div class="brand-name">Service Solution</div>
          <div class="brand-sub">Customer Review</div>
        </div>
      </div>
      <a href="/admin" class="admin-link">Admin</a>
    </div>

    <div class="card">
      <div class="card-navy">
        <span class="eyebrow"><span class="dot"></span> QR Universal</span>
        <h1>Satu QR untuk semua.</h1>
        <p>Scan untuk langsung memberi ulasan — tidak perlu pilih cabang. Admin yang menentukan cabangnya.</p>
      </div>
      <div class="card-body">
        <div class="qr-box">
          <img src="/api/qr.svg" alt="QR Code" />
        </div>
        <div class="qr-url" id="urlText">…</div>
        <div class="qr-hint">Atau buka tautan langsung dari perangkat</div>
        <div class="actions">
          <a href="/feedback" class="btn btn-primary">Buka Form Ulasan</a>
          <button class="btn btn-secondary" onclick="copyUrl()">Salin URL</button>
        </div>
      </div>
    </div>
    <p class="note">Customer Review · all-in-one QR</p>
  </div>

  <script>
    document.getElementById('urlText').textContent = window.location.origin + '/feedback';
    function copyUrl() {
      navigator.clipboard.writeText(window.location.origin + '/feedback').then(() => {
        const btn = document.querySelector('.btn-secondary');
        btn.textContent = 'Tersalin ✓';
        setTimeout(() => (btn.textContent = 'Salin URL'), 2000);
      });
    }
  </script>
</body>
</html>
